[project]
name = "web-scraper"
version = "0.1.0"
description = "A web scraper with a FastAPI backend and web UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "curl_cffi>=0.7.0",
    "ddgs>=7.0.0",
]
